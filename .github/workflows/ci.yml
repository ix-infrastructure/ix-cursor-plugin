name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes don't pile up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Config / manifest validation ─────────────────────────────────────────
  # This repo has no build system: it's markdown + JSON manifests + shell
  # install scripts. The gate lints the shell and parses every JSON file.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on ubuntu-latest runners. Scope to error
      # severity: this gate catches real bugs (unset vars, bad quoting that
      # changes behavior) without failing on stylistic SC2086-class notes.
      - name: Shellcheck (severity=error)
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -d '' files < <(find . -name '*.sh' \
            -not -path './.git/*' -not -path '*/node_modules/*' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell scripts found"; exit 0
          fi
          printf 'checking: %s\n' "${files[@]}"
          shellcheck --severity=error "${files[@]}"

      # Validate that every committed JSON manifest parses. node is preinstalled
      # on ubuntu-latest. node_modules/dist/.git are excluded.
      - name: Validate JSON
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; then
              echo "  [ok] $f"
            else
              echo "  [FAIL] invalid JSON: $f"
              fail=1
            fi
          done < <(find . -name '*.json' \
            -not -path './.git/*' -not -path '*/node_modules/*' -not -path '*/dist/*' -print0)
          exit $fail

  # ── mcp/ build gate ─────────────────────────────────────────────────
  # Added with the `npm` Dependabot entry for /mcp, deliberately in the same
  # change. That entry opens a weekly stream of dependency PRs, and without a
  # job that actually installs and compiles mcp/, every one of them would be
  # green on shellcheck and a JSON parse while proving nothing.
  #
  # This is not hypothetical for this repo: mcp/dist is COMMITTED and nothing
  # rebuilds it, so a bump that breaks `tsc` would surface only when someone
  # next runs install.sh's build path. tsx is also what executes the test
  # suite, and it is not in the ignore list.
  #
  # typecheck + build only. `npm test` is deliberately NOT run here: its
  # integration tests drive a POSIX mock `ix` and are a separate piece of work.
  mcp:
    name: mcp build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci
        working-directory: mcp

      # `npm ci` does NOT catch the drift that caused this repo's 5 unfixable
      # Dependabot alerts, so this step exists instead. Measured, not assumed:
      # replay #24's tree -- package.json with `dependencies: {}` against a lock
      # whose root still requires @modelcontextprotocol/sdk and zod -- and
      # `npm ci` exits 0, "added 6 packages", the same 6 a correct lock installs.
      # It only errors in the OTHER direction, a manifest dep missing from the
      # lock. Regenerating the lock and diffing is what actually sees it:
      # against that same replay this exits 1, and against the current tree it
      # exits 0.
      #
      # That drift is invisible at install time and only surfaces in the
      # dependency graph, as alerts naming packages nothing installs.
      - name: Lockfile is in sync with package.json
        run: |
          npm install --package-lock-only --no-audit --no-fund
          git diff --exit-code -- package-lock.json
        working-directory: mcp

      - name: Typecheck
        run: npm run typecheck
        working-directory: mcp

      - name: Build
        run: npm run build
        working-directory: mcp

      # mcp/dist is COMMITTED -- 68 tracked files -- and install.sh:102 only
      # rebuilds it when prompt-briefing.js is MISSING, never when it is stale.
      # So building without comparing the emit leaves the exact gap this job was
      # added for: typescript majors are ignored here but minors are not, and a
      # minor that changes emit would go green while every user keeps running
      # the old build. Rebuilding is byte-identical today, so this passes now
      # and bites later, which is the point.
      # `git status --porcelain`, not `git diff --exit-code`: git diff never
      # reports UNTRACKED paths, and the likeliest drift is exactly that --
      # add mcp/hooks/foo.ts, commit the .ts, forget the four emitted files,
      # and tsc writes them as untracked while `git diff` exits 0. The gate
      # would be green with the hook missing from every install.
      - name: Committed dist matches the build
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "mcp/dist differs from a clean build:"
            git status --porcelain -- dist
            exit 1
          fi
        working-directory: mcp

  # ── Aggregate gate ───────────────────────────────────────────────────────
  # One stable required-status-check context. Fails if validate failed OR was
  # skipped/cancelled, so the job graph can be reshaped without orphaning the
  # required check.
  ci-success:
    name: CI Passed
    if: always()
    needs: [validate, mcp]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "validate=${{ needs.validate.result }}"
          echo "mcp=${{ needs.mcp.result }}"
          [ "${{ needs.validate.result }}" = "success" ]
          [ "${{ needs.mcp.result }}" = "success" ]
